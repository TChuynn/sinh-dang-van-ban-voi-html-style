<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên kết yêu thích</title>
</head>

<body>

    <!-- Tiêu đề chính -->
    <h1>Liên kết yêu thích của tôi</h1>

    <!-- Danh sách không có thứ tự chứa các liên kết -->
    <ul>
        <!-- 1. Liên kết ngoài mở trong tab mới (target="_blank") -->
        <li>
            <a href="https://www.google.com" target="_blank">Tìm kiếm trên Google (Mở tab mới)</a>
        </li>

        <!-- 2. Liên kết ngoài mở trong tab hiện tại -->
        <li>
            <a href="https://www.youtube.com">Xem video trên YouTube</a>
        </li>

        <!-- 3. Liên kết đến trang nội bộ trong cùng thư mục (about.html) -->
        <li>
            <a href="about.html">Xem trang Giới thiệu (About)</a>
        </li>

        <!-- 4. Liên kết mở ứng dụng gửi Email (mailto:) -->
        <li>
            <a href="mailto:duyle@example.com">Gửi email cho tôi</a>
        </li>
    </ul>

</body>

</html>
